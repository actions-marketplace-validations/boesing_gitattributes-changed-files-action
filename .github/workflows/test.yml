name: Test

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run test cases
        shell: bash
        run: |
          failed=()
          for case_dir in test/cases/*/; do
            case_name="$(basename "$case_dir")"
            echo "::group::$case_name"
            if ! test/run-test-case.sh "$case_name"; then
              failed+=("$case_name")
            fi
            echo "::endgroup::"
          done

          if [ "${#failed[@]}" -eq 0 ]; then
            echo "All test cases passed."
            exit 0
          fi

          {
            echo "### Failed test cases (${{ matrix.os }})"
            printf -- '- `%s`\n' "${failed[@]}"
          } >>"$GITHUB_STEP_SUMMARY"

          echo "Failed test cases:"
          for case_name in "${failed[@]}"; do
            echo "::error title=Test case failed::$case_name"
          done
          exit 1
