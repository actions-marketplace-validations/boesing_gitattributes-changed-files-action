name: 'Check Export-Ignore Changes'
description: >
  Determines whether the changes between two commits touch any path that is not marked
  export-ignore in .gitattributes.
author: 'boesing'
branding:
  icon: 'git-branch'
  color: 'blue'

inputs:
  base-sha:
    description: >
      The base commit SHA to diff from. If omitted, defaults to github.event.pull_request.base.sha
      on pull_request events, otherwise github.event.before (falls back to the parent of head-sha
      if that is the zero SHA or not resolvable, e.g. on the first push to a branch or after a
      force-push).
    required: false
  head-sha:
    description: >
      The head commit SHA to diff to. If omitted, defaults to github.event.pull_request.head.sha
      on pull_request events, otherwise github.sha.
    required: false
  main-branch:
    description: >
      The ref that is expected to always be fast-forwarded via a merge commit (e.g. because
      squash/rebase merges are disabled). When the workflow is running on this ref, the action
      fails if head-sha is not a merge commit.
    required: false
    default: 'refs/heads/main'

outputs:
  files_changed:
    description: '"true" if any changed file is not export-ignored, otherwise "false".'
    value: ${{ steps.check.outputs.files_changed }}

runs:
  using: 'composite'
  steps:
    - id: check
      shell: bash
      run: ${{ github.action_path }}/scripts/check-export-ignore.sh
      env:
        INPUT_BASE_SHA: ${{ inputs.base-sha }}
        INPUT_HEAD_SHA: ${{ inputs.head-sha }}
        EVENT_BEFORE: ${{ github.event.before }}
        EVENT_AFTER: ${{ github.sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        INPUT_MAIN_BRANCH: ${{ inputs.main-branch }}
        CURRENT_REF: ${{ github.ref }}
